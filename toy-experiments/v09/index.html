<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMERGENCE V0.9</title><style>:root{font:14px system-ui;color:#e9f1fa;background:#0c1320}*{box-sizing:border-box}body{margin:0}header{padding:14px;border-bottom:1px solid #34445b;display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0}main{display:grid;grid-template-columns:1.6fr 1fr;min-height:calc(100dvh - 62px)}#scene{width:100%;height:62vh;min-height:320px;touch-action:none}#viewport{position:relative;background:radial-gradient(circle,#162940,#0b111b)}#legend{position:absolute;bottom:10px;left:12px;background:#0a111bcc;padding:8px;border-radius:8px;color:#c5d1df}aside{border-left:1px solid #34445b;min-width:0}.controls,.stats,.panel{padding:12px;border-bottom:1px solid #34445b}.controls{display:flex;gap:7px;flex-wrap:wrap}button,select{padding:9px;background:#1d344b;color:white;border:1px solid #44617d;border-radius:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:#17263a;padding:9px;border-radius:8px}.stats strong{display:block;font-size:22px}small{color:#9db0c4}#trail{height:35vh;overflow:auto;padding:10px;font:11px ui-monospace,monospace}#trail div{padding:3px;border-bottom:1px solid #223349}#detail{white-space:pre-wrap;font:12px ui-monospace,monospace}h2{font-size:14px;margin:0 0 8px}@media(max-width:760px){main{display:block}#scene{height:46vh}aside{border-left:0}}</style></head><body><header><h1>EMERGENCE · V0.9</h1><small>Sdom 3D · propagação espacial · teste prospectivo</small></header><main><section id="viewport"><canvas id="scene"></canvas><div id="legend">Azul: Utrd · Âmbar: marca · Verde: Upro<br>Arraste para girar · toque para inspecionar · sem cubo</div></section><aside><div class="controls"><button id="run">Executar</button><button id="step">Passo</button><button id="pause">Pausar</button><button id="reset">Reiniciar</button><select id="scenario"><option value="associated">Associação estável</option><option value="independent">Independente</option><option value="variable">Atraso variável</option><option value="phase_change">Mudança de fase</option></select><button id="export">Exportar trilha</button></div><div class="stats"><div><small>Upro</small><strong id="upros">0</strong></div><div><small>Uint</small><strong id="uints">0</strong></div><div><small>Marcas</small><strong id="marks">0</strong></div><div><small>Tempo</small><strong id="time">0</strong></div><div><small>Teste: acertos</small><strong id="hits">0/0</strong></div><div><small>Trilhas</small><strong id="events">0</strong></div></div><div class="panel"><h2>Inspeção</h2><div id="detail">Toque em uma entidade</div></div><div class="panel"><h2>Eventos auditáveis</h2></div><div id="trail"></div></aside></main><script type="module" src="./src/main.js"></script></body></html>
