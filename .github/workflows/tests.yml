name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node experiments/phase1-inputs.js --json > /dev/null
      - run: node experiments/phase1-inputs.js --tempo-control > /dev/null
