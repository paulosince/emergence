name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node experiments/phase1-inputs.js --json > /dev/null
      - run: node experiments/phase1-inputs.js --tempo-control > /dev/null
      - run: node experiments/world-1d-baseline.js --json > /dev/null
      - run: node experiments/world-1d-baseline.js --csv > /dev/null
      - run: node experiments/world-senses.js --json > /dev/null
      - run: node experiments/world-senses.js --optical-only > /dev/null
      - run: node experiments/world-senses.js --mechanical-only > /dev/null
      - run: node experiments/world-senses.js --no-sensors > /dev/null
      - run: npm run experiment:controls > /dev/null
      - run: npm run experiment:controls:json > /dev/null
      - run: npm run experiment:controls:coincident > /dev/null
      - run: npm run experiment:controls:staggered > /dev/null
      - run: npm run experiment:body:json > /dev/null
      - run: npm run experiment:body:csv > /dev/null
      - run: npm run experiment:body:extero > /dev/null
      - run: npm run experiment:body:proprio > /dev/null
      - run: npm run experiment:body:intero > /dev/null
      - run: npm run experiment:body:none > /dev/null
      - run: npm run experiment:body:no-lift > /dev/null
      - run: node --check app/inspector.js
      - run: node --check src/body/actuated-world.js
      - run: node --check src/body/body-signals.js
      - run: node scripts/smoke-inspector-dom.mjs
      - run: npm run experiment:room > /dev/null
      - run: npm run experiment:room:json > /dev/null
      - run: npm run experiment:room:overcast > /dev/null
      - run: npm run experiment:room:none > /dev/null
      - run: node --check app/room-inspector.js
      - run: node scripts/smoke-room-dom.mjs
      - run: node experiments/room-day.js --json > /dev/null
      - run: node experiments/room-day.js --overcast > /dev/null
      - run: node experiments/room-day.js --no-sensors > /dev/null
      - run: node --check app/room.js
      - run: node scripts/smoke-room-home-dom.mjs
      - run: npm run experiment:room:replication > /dev/null
      - run: node --check src/persistence/archive.js
      - run: node --check src/runtime/experiment-session.js
