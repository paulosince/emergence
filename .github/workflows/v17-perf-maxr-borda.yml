name: EMERGENCE V17 - limite MAXR de borda
on:
  push:
    branches: [perf-motor-par]
    paths:
      - .github/workflows/v17-perf-maxr-borda.yml
      - toy-experiments/v17/ensaio-minimo/perf_maxr_borda.py
  workflow_dispatch:
jobs:
  borda:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bibliotecas do motor original
        run: python -m pip install 'numpy==2.3.5' 'numba==0.65.1'
      - name: Comprovar comportamento de MAXR=512 sem alterar MAXR
        run: |
          set -o pipefail
          (cd toy-experiments/v17/ensaio-minimo && python -u perf_maxr_borda.py) | tee perf-v17-maxr-borda.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v17-maxr-borda
          path: |
            perf-v17-maxr-borda.log
            toy-experiments/v17/ensaio-minimo/perf-v17-maxr-borda.json
          retention-days: 30
