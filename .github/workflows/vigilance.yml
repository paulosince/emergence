# Alert channel "do GitHub" (decision A+B, 09/11/2026): runs the vigilance
# campaign daily; if the fail-closed STOP fires (or the run fails), opens an
# issue labelled "alerta-emergence" so the GitHub app sends a push.
# Note: scheduled workflows run only from the repository's DEFAULT branch;
# on other branches use "Run workflow" (workflow_dispatch).
name: Vigilância EMERGENCE
on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  vigilance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Campanha de vigilância (parada que falha fechada)
        id: run
        continue-on-error: true
        run: node scripts/monitor.mjs --plan=campaigns/vigilance-plan.json --dir=results/vigilancia > vigilance-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vigilancia-${{ github.run_id }}
          path: |
            results/vigilancia
            vigilance-report.json
      - name: Alerta (issue) se houve parada ou falha
        if: steps.run.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'A campanha de vigilância parou (parada que falha fechada) ou falhou.\n\n';
            try { body += '```json\n' + fs.readFileSync('results/vigilancia/STOP.json', 'utf8') + '\n```\n'; } catch { body += 'Sem STOP.json: verifique o log da execução.\n'; }
            body += `\nExecução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nRetomar exige RESUME.json com o incidente, quem decidiu e por quê.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            await github.rest.issues.create({ ...context.repo, title: 'ALERTA EMERGENCE: parada da campanha de vigilância', body, labels: ['alerta-emergence'] });
