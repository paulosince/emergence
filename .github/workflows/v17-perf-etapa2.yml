name: EMERGENCE V17 - etapa 2 (MAXR e duracoes)
on:
  push:
    branches: [perf-motor-par]
    paths:
      - .github/workflows/v17-perf-etapa2.yml
      - toy-experiments/v17/ensaio-minimo/perf_etapa2.py
  workflow_dispatch:
jobs:
  medir:
    name: ${{ matrix.rotulo }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rotulo: curta-120ms-sete-condicoes
            duracao: 120
            argumentos: --todos
          - rotulo: media-1000ms-I1
            duracao: 1000
            argumentos: --cond I1
          - rotulo: longa-10000ms-I1
            duracao: 10000
            argumentos: --cond I1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar versoes fixadas do diagnostico
        run: python -m pip install 'numpy==2.3.5' 'numba==0.65.1'
      - name: Equivalencia exata e observacao MAXR (nenhuma otimizacao)
        run: |
          set -o pipefail
          python -u toy-experiments/v17/ensaio-minimo/perf_etapa2.py --duracao-ms ${{ matrix.duracao }} ${{ matrix.argumentos }} | tee perfil-etapa2-${{ matrix.duracao }}.log
      - name: Arquivar logs e resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etapa2-${{ matrix.rotulo }}
          path: |
            perfil-etapa2-${{ matrix.duracao }}.log
            perf-v17-etapa2-${{ matrix.duracao }}ms.json
          retention-days: 30
