name: EMERGENCE V17 - etapa 2 (10s, casos adicionais)
on:
  push:
    branches: [perf-motor-par]
    paths:
      - .github/workflows/v17-perf-etapa2-10s-extra.yml
  workflow_dispatch:
jobs:
  medir:
    name: dez-segundos-${{ matrix.cond }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        cond: [F, I0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Versoes fixadas
        run: python -m pip install 'numpy==2.3.5' 'numba==0.65.1'
      - name: Medir motor original e copia instrumentada sem tolerancia
        run: |
          set -o pipefail
          python -u toy-experiments/v17/ensaio-minimo/perf_etapa2.py --duracao-ms 10000 --cond ${{ matrix.cond }} | tee perfil-etapa2-10s-${{ matrix.cond }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etapa2-10s-${{ matrix.cond }}
          path: |
            perfil-etapa2-10s-${{ matrix.cond }}.log
            perf-v17-etapa2-10000ms.json
          retention-days: 30
